name: CI

# Deploys are handled by Cloudflare Workers Builds (connected to this repo in
# the Cloudflare dashboard), so this workflow only verifies — it never deploys.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  BUN_VERSION: '1.3.6'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── 1. TypeScript & Build ──────────────────────────────────────────────────
  build:
    name: TypeScript & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Copy USWDS assets
        run: node scripts/setup-uswds.mjs

      - name: TypeScript check
        run: bun run check

      - name: Build site
        run: bun run build

      # The Cloudflare adapter writes prerendered HTML to dist/client and the
      # worker to dist/server. Only the static output is needed downstream.
      - name: Upload static output
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/client/
          retention-days: 1

  # ── 2. HTML Validation ─────────────────────────────────────────────────────
  html-validate:
    name: HTML Validation
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/client/

      # The dev-only /internal/ component preview intentionally renders
      # components out of document context (multiple <h1>s, etc.).
      - name: HTML Validation
        run: find dist/client -name '*.html' -not -path 'dist/client/internal/*' -print0 | xargs -0 bunx html-validate

  # ── 3. Accessibility (axe-core) ────────────────────────────────────────────
  a11y:
    name: Accessibility (axe-core)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/client/

      # @axe-core/cli bundles the latest ChromeDriver, which is often one
      # version ahead of the runner's Chrome — install a matching one.
      - name: Install ChromeDriver matching runner Chrome
        run: |
          CHROME_VER=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+\.\d+')
          echo "Runner Chrome: $CHROME_VER"
          npx -y browser-driver-manager install chrome@${CHROME_VER}
          source "$HOME/.browser-driver-manager/.env"
          DRIVER="$CHROMEDRIVER_TEST_PATH"
          [[ "$DRIVER" != /* ]] && DRIVER="$HOME/$DRIVER"
          if [ ! -f "$DRIVER" ]; then
            echo "::error::ChromeDriver not found at $DRIVER" && exit 1
          fi
          echo "CHROMEDRIVER_PATH=$DRIVER" >> "$GITHUB_ENV"

      - name: Start static server
        run: npx -y serve dist/client --listen 4000 &

      - name: Wait for server
        run: npx -y wait-on -t 30000 http://127.0.0.1:4000/

      # Every prerendered page (en + es, including 404), excluding /internal/.
      - name: Accessibility check (axe-core)
        run: |
          URLS=$(cd dist/client && find . \( -name index.html -o -name 404.html \) -not -path './internal/*' \
            | sed 's|^\.||; s|index\.html$||; s|^|http://127.0.0.1:4000|' \
            | sort | tr '\n' ' ')
          npx -y @axe-core/cli \
            $URLS \
            --chromedriver-path "$CHROMEDRIVER_PATH" \
            --exit \
            --timeout 60000

  # ── 4. Lighthouse CI ───────────────────────────────────────────────────────
  lighthouse:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/client/

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  # ── 5. Link Check (linkinator) ─────────────────────────────────────────────
  links:
    name: Link Check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/client/

      - name: Start static server
        run: npx -y serve dist/client --listen 4001 &

      - name: Wait for server
        run: npx -y wait-on -t 30000 http://127.0.0.1:4001/

      # Server-rendered routes (prerender = false) only exist on the worker,
      # so a static server can't serve them — skip those.
      - name: Check internal links
        run: |
          npx -y linkinator http://127.0.0.1:4001/ \
            --recurse \
            --skip "^(?!http://127\.0\.0\.1)" \
            --skip "tel:" \
            --skip "/cart-builder/" \
            --skip "/payment-result" \
            --skip "/invoice" \
            --skip "/admin" \
            --skip "/o/" \
            --verbosity error
